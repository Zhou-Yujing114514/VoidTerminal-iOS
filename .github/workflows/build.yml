name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

    - name: Build
      run: |
        xcodebuild -project VoidTerminal.xcodeproj \
          -scheme VoidTerminal \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build

    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/VoidTerminal.app Payload/
        python3 -c "
import zipfile, os
with zipfile.ZipFile('VoidTerminal.ipa', 'w', zipfile.ZIP_DEFLATED) as zf:
    zf.writestr('Payload/', '')
    for root, dirs, files in os.walk('Payload'):
        for d in dirs:
            zf.writestr(os.path.join(root, d) + '/', '')
        for f in files:
            fp = os.path.join(root, f)
            zf.write(fp, fp)
print('IPA packaged:', os.path.getsize('VoidTerminal.ipa'), 'bytes')
"
        rm -rf Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: VoidTerminal.ipa
        path: VoidTerminal.ipa
